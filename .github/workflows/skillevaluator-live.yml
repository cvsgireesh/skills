name: skillevaluator-live

# NVIDIA SkillEvaluator, Tier 3: live agent evaluation of one skill. A real agent
# harness attempts each case in the skill's evals/evals.json twice over — with the skill
# installed and without it — in Harbor containers, and SkillEvaluator grades both arms on
# security, correctness, discoverability, effectiveness and efficiency and reports the
# difference as Skill Lift.
#
# This is the skill-vs-no-skill question evaluation/harbor/README.md calls Level 2,
# asked of a different evidence source: that level runs the executable tasks under
# evaluation/harbor/tasks/ through tools/compare_harbor_skill.py and reads a verifier's
# reward; this one runs the prompt datasets under skills/*/evals/ and reads a judge's
# grades. Neither replaces the other, and this workflow does not feed suites.json or a
# skill's `validated` status, which stay the maintainer decisions MAINTAINERS.md says they
# are. Its report is evidence to attach to that decision.
#
# Dispatched by hand, never on a pull request, for the reason validate.yml gives for
# keeping Levels 2 and 3 out of it: it needs inference credentials a fork cannot have,
# and a run costs money. `workflow_dispatch` is only available to people with write
# access, and the job runs in the `skillevaluator-live` environment, so the credentials
# can be scoped to that environment and gated behind a required reviewer.
#
# Credentials are read from secrets into the job environment, the only place
# SkillEvaluator accepts them (it rejects a credential named in evals/config.yml
# runtime_env). Only the secrets that are set are exported, because SkillEvaluator refuses
# to guess between two provider keys and GitHub renders an unset secret as an empty
# string, which is not the same as unset.
#
#   evaluator (judge)   SKILL_EVAL_LLM_PROVIDER from the input below, plus its key:
#                       ANTHROPIC_API_KEY, OPENAI_API_KEY, NVIDIA_API_KEY, or the AWS pair
#                       for bedrock
#   claude-code agent   ANTHROPIC_API_KEY (or the AWS pair) and an explicit
#                       --agent-model claude-code=MODEL
#   codex agent         OPENAI_API_KEY (+ OPENAI_BASE_URL) and an explicit model
#   opencode agent      NVIDIA_API_KEY
#
# `skillevaluator doctor` runs first and names whatever is missing before any trial
# starts.

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill directory under skills/ (must ship evals/evals.json)"
        required: true
        type: string
      agents:
        description: "Comma-separated harnesses: claude-code, codex, opencode"
        required: true
        default: "claude-code"
        type: string
      agent_model:
        description: "Per-agent model, AGENT=MODEL (e.g. claude-code=claude-sonnet-5). Comma-separated for several."
        required: false
        default: ""
        type: string
      evaluator_provider:
        description: "Provider for the Tier 3 judge (SKILL_EVAL_LLM_PROVIDER)"
        required: true
        default: "anthropic"
        type: choice
        options: [anthropic, openai, nv_build, bedrock]
      n_attempts:
        description: "Attempts per case. suites.json: 1 probe, 3 calibration, 5 promotion."
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "5"]
      skip_baseline:
        description: "Skip the without-skill arm (no lift; cheaper smoke run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.skill }}
  cancel-in-progress: false

env:
  # Same pin as skillevaluator.yml; bump the two together.
  SKILLEVALUATOR_COMMIT: 41e5469a229e82f97e4d3597d3422efa703fd4fe
  HARBOR_TELEMETRY: "off"

jobs:
  live-eval:
    name: Live evaluation (${{ inputs.skill }})
    runs-on: ubuntu-latest
    # The environment is where the provider secrets should live, with a required
    # reviewer, so dispatching a run is not by itself permission to spend on it.
    environment: skillevaluator-live
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs are free text typed by a person, so they are checked against the shape
      # they must have before anything interpolates them into a command line.
      - name: Check inputs
        env:
          SKILL: ${{ inputs.skill }}
          AGENTS: ${{ inputs.agents }}
          AGENT_MODEL: ${{ inputs.agent_model }}
        run: |
          set -euo pipefail
          [[ "$SKILL" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::skill must be a kebab-case directory name"; exit 1; }
          [ -f "skills/${SKILL}/SKILL.md" ] || { echo "::error::skills/${SKILL} is not a skill"; exit 1; }
          [ -d "skills/${SKILL}/evals" ] || { echo "::error::skills/${SKILL} ships no evals/ dataset to run; see templates/evals.json"; exit 1; }
          [[ "$AGENTS" =~ ^(claude-code|codex|opencode)(,(claude-code|codex|opencode))*$ ]] || { echo "::error::agents must be a comma-separated subset of claude-code,codex,opencode"; exit 1; }
          [[ -z "$AGENT_MODEL" || "$AGENT_MODEL" =~ ^[a-z-]+=[A-Za-z0-9._:/-]+(,[a-z-]+=[A-Za-z0-9._:/-]+)*$ ]] || { echo "::error::agent_model must be AGENT=MODEL[,AGENT=MODEL]"; exit 1; }

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install SkillEvaluator
        run: |
          uv tool install --python 3.13 \
            "skillevaluator[tier3] @ git+https://github.com/NVIDIA/SkillEvaluator.git@${SKILLEVALUATOR_COMMIT}"
          uv tool dir --bin >> "$GITHUB_PATH"
          "$(uv tool dir --bin)/skillevaluator" --version

      # Before spending anything, the keyless contract check the PR gate also runs.
      - name: Dataset is runnable
        env:
          SKILL: ${{ inputs.skill }}
        run: skillevaluator tier3 validate "skills/${SKILL}" --strict

      # Export only the secrets that are set; see the header for why an empty one is not
      # harmless. Written to GITHUB_ENV so later steps inherit them, and masked by the
      # runner because they come from secrets.
      - name: Export provider credentials
        env:
          IN_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IN_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          IN_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          IN_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          IN_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          IN_AWS_REGION: ${{ secrets.AWS_REGION }}
          PROVIDER: ${{ inputs.evaluator_provider }}
        run: |
          set -euo pipefail
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY OPENAI_BASE_URL NVIDIA_API_KEY \
                      AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            value="$(printenv "IN_${name}" || true)"
            if [ -n "$value" ]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
              echo "exported ${name}"
            fi
          done
          echo "SKILL_EVAL_LLM_PROVIDER=${PROVIDER}" >> "$GITHUB_ENV"

      - name: Readiness
        env:
          AGENTS: ${{ inputs.agents }}
          AGENT_MODEL: ${{ inputs.agent_model }}
        run: |
          set -euo pipefail
          args=(--agents "$AGENTS" --env-mode docker)
          IFS=',' read -r -a models <<< "$AGENT_MODEL"
          for m in "${models[@]}"; do [ -n "$m" ] && args+=(--agent-model "$m"); done
          skillevaluator doctor "${args[@]}"

      - name: Evaluate
        env:
          SKILL: ${{ inputs.skill }}
          AGENTS: ${{ inputs.agents }}
          AGENT_MODEL: ${{ inputs.agent_model }}
          N_ATTEMPTS: ${{ inputs.n_attempts }}
          SKIP_BASELINE: ${{ inputs.skip_baseline }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--agents "$AGENTS" --env-mode docker --n-attempts "$N_ATTEMPTS"
                --results-dir results --progress plain
                --evaluated-source-repository "$REPO"
                --evaluated-source-revision "$SHA")
          IFS=',' read -r -a models <<< "$AGENT_MODEL"
          for m in "${models[@]}"; do [ -n "$m" ] && args+=(--agent-model "$m"); done
          [ "$SKIP_BASELINE" = "true" ] && args+=(--skip-baseline)
          skillevaluator tier3 evaluate "skills/${SKILL}" "${args[@]}"

      - name: Summarize
        if: always()
        env:
          SKILL: ${{ inputs.skill }}
        run: |
          {
            echo "## SkillEvaluator live evaluation: ${SKILL}"
            echo
            echo '```'
            skillevaluator tier3 compare "skills/${SKILL}" --results-dir results 2>&1 || echo "no comparable results"
            echo '```'
            echo
            echo "Full report: the \`skillevaluator-live-${SKILL}\` artifact (report.html, result.json, run_config.json)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillevaluator-live-${{ inputs.skill }}
          path: results/
          if-no-files-found: warn
